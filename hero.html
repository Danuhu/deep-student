<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Deep Student —— 开源、本地优先的 AI 学习工作台" />
    <title>Deep Student · AI 学习工作台</title>
    <style>
      /* 色板与应用本体同轨：中性灰度（hue 0 / sat 0）+ 冷调墨（= --foreground）
         + 静海蓝 accent（= 默认 palette --primary）。亮色纸面取 --secondary 同族
         98%，让纯白窗口自然浮起；暗色纸面略深于应用背景（0 0% 9%）。 */
      :root {
        color-scheme: light;
        --paper: hsl(0 0% 98%);
        --ink: hsl(220 9% 18%);
        --ink-2: hsl(220 6% 42%);
        --ink-3: hsl(220 5% 56%);
        --hairline: hsl(0 0% 88%);
        --grid-line: hsl(220 9% 18% / 0.055);
        --accent: hsl(215 72% 42%);
        --window-bg: hsl(0 0% 100%);
        --window-border: hsl(0 0% 85%);
        --window-shadow:
          0 1px 1px hsl(0 0% 0% / 0.04),
          0 12px 28px -12px hsl(0 0% 0% / 0.16),
          0 48px 96px -40px hsl(0 0% 0% / 0.22);
        /* 舞台宽度：真实窗口宽 1112 为上限；视口偏矮时按可用高度反推保证窗壳完整可见
           （reserve 360px ≈ 刊头+题辞区+舞台顶距的实际占位）。刊头胶囊与窗壳共用。
           手机模式（≤767px）的覆盖规则在样式表末尾（同特异性需后写）。 */
        --stage-w: min(1112px, 92vw, calc((100dvh - 360px) * 1.4387));
      }

      html[data-theme='dark'] {
        color-scheme: dark;
        --paper: hsl(0 0% 7%);
        --ink: hsl(0 0% 96%);
        --ink-2: hsl(0 0% 62%);
        --ink-3: hsl(0 0% 46%);
        --hairline: hsl(0 0% 19%);
        --grid-line: hsl(0 0% 96% / 0.06);
        --accent: hsl(214 64% 72%);
        --window-bg: hsl(0 0% 9%);
        --window-border: hsl(0 0% 21%);
        --window-shadow:
          0 1px 1px hsl(0 0% 0% / 0.4),
          0 12px 32px -10px hsl(0 0% 0% / 0.55),
          0 56px 112px -32px hsl(0 0% 0% / 0.6);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100dvh;
        background: var(--paper);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC',
          'Segoe UI', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
      }

      ::selection {
        background: color-mix(in hsl, var(--accent) 20%, transparent);
      }

      /* 分页容器：桌面端复刻原 body 的 flex 布局（视觉零变化）；
         手机端由 JS 分页器用 transform 整屏平移（见末尾媒体查询） */
      .pages {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 100dvh;
      }

      /* 分页圆点：桌面不显示 */
      .pager-dots {
        display: none;
      }

      /* 稿纸方格：错题本/演算纸的肌理，边缘用径向渐隐收住。
         也是玻璃折射的"被摄物"——静止时透镜边沿把格线弯折，让玻璃在素底上仍可读。 */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(var(--grid-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: radial-gradient(ellipse 90% 80% at 50% 42%, black 55%, transparent 100%);
        -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 42%, black 55%, transparent 100%);
      }

      /* ================= Liquid Glass 材质 =================
         三层叠加：
         ① 背景采样 backdrop-filter —— SVG feDisplacementMap 做边缘折射（位移图由
            内联脚本按元素实际尺寸/圆角生成：透镜剖面，边沿最强、向中心快速衰减，
            向内采样 = 边沿放大），之后轻 blur + saturate。不支持 backdrop 引用
            SVG 滤镜的引擎（Safari/Firefox）停留在下面这行 CSS 回退。
         ② 极低不透明 tint —— 玻璃有色但不遮挡。
         ③ 表面光学 —— 1px 随形镜面边缘（顶亮 / 侧弱 / 底部回光）、左上柔光、
            底部厚度阴影、外侧 hairline 定边、落影。 */
      .glass {
        position: relative;
        isolation: isolate;
        border-radius: 999px;
        --glass-tint: color-mix(in hsl, var(--paper) 42%, transparent);
        --glass-edge: color-mix(in hsl, var(--ink) 9%, transparent);
        --rim-top: rgba(255, 255, 255, 0.92);
        --rim-mid: rgba(255, 255, 255, 0.16);
        --rim-bot: rgba(255, 255, 255, 0.55);
        --sheen: rgba(255, 255, 255, 0.3);
        --depth: hsl(0 0% 0% / 0.035);
        background: var(--glass-tint);
        -webkit-backdrop-filter: blur(12px) saturate(1.4);
        backdrop-filter: blur(12px) saturate(1.4);
        box-shadow:
          0 0 0 1px var(--glass-edge),
          0 1px 2px hsl(0 0% 0% / 0.05),
          0 12px 32px -14px hsl(0 0% 0% / 0.22);
      }

      html[data-theme='dark'] .glass {
        --glass-tint: color-mix(in hsl, var(--ink) 7%, transparent);
        --glass-edge: rgba(255, 255, 255, 0.06);
        --rim-top: rgba(255, 255, 255, 0.34);
        --rim-mid: rgba(255, 255, 255, 0.05);
        --rim-bot: rgba(255, 255, 255, 0.16);
        --sheen: rgba(255, 255, 255, 0.1);
        --depth: hsl(0 0% 0% / 0.2);
        box-shadow:
          0 0 0 1px var(--glass-edge),
          0 1px 2px hsl(0 0% 0% / 0.4),
          0 14px 36px -14px hsl(0 0% 0% / 0.6);
      }

      /* 镜面边缘：渐变只落在 1px 环上（mask 挖空 content-box） */
      .glass::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 0;
        border-radius: inherit;
        pointer-events: none;
        padding: 1px;
        background: linear-gradient(180deg, var(--rim-top), var(--rim-mid) 38%, var(--rim-mid) 62%, var(--rim-bot));
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask-composite: exclude;
      }

      /* 表面受光：左上柔光 + 底部厚度阴影 */
      .glass::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 0;
        border-radius: inherit;
        pointer-events: none;
        background:
          radial-gradient(120% 90% at 28% -30%, var(--sheen), transparent 62%),
          linear-gradient(180deg, transparent 55%, var(--depth));
      }

      /* 文字/图标浮在玻璃表面之上 */
      .glass > * {
        position: relative;
        z-index: 1;
      }

      /* ---------- 刊头：两枚悬浮玻璃胶囊，与窗壳左右边缘对齐。
         sticky 停在顶部——滚动时窗口从胶囊下穿过，边沿把应用 UI 弯折。 ---------- */
      .masthead {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        justify-content: center;
        padding: 14px 24px 0;
        pointer-events: none;
      }

      .masthead-inner {
        width: var(--stage-w);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .pill {
        pointer-events: auto;
        height: 40px;
        padding: 0 16px;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--ink-3);
        white-space: nowrap;
      }

      .pill .brand {
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.01em;
        color: var(--ink);
      }

      .pill .mark {
        width: 16px;
        height: 16px;
        display: block;
        color: var(--ink);
      }

      /* ---------- 题辞区：kicker（subject）/ 标题 / 摘要 / 动作 ---------- */
      .hero {
        text-align: center;
        padding: clamp(32px, 5vh, 48px) 24px 0;
      }

      .kicker {
        margin: 0 0 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        font-size: 11.5px;
        font-weight: 600;
        /* 加字距居中时末字符的尾随空距会让视心偏左，用同值 text-indent 补回 */
        letter-spacing: 0.38em;
        text-indent: 0.38em;
        color: var(--ink-3);
      }

      .kicker::before {
        content: '';
        width: 5px;
        height: 5px;
        background: var(--accent);
        /* 方块不参与字距补偿 */
        text-indent: 0;
      }

      .hero h1 {
        margin: 0;
        font-family: 'Songti SC', 'STSong', 'Noto Serif SC', 'Source Han Serif SC', serif;
        font-size: clamp(30px, 4vw, 44px);
        font-weight: 600;
        letter-spacing: 0.05em;
        line-height: 1.3;
      }

      .hero .sub {
        margin: 12px auto 0;
        max-width: 560px;
        color: var(--ink-2);
        font-size: clamp(13.5px, 1.35vw, 15px);
        line-height: 1.9;
      }

      /* 动作行：胶囊玻璃——主按钮为烟色墨玻璃，次按钮为清玻璃。
         accent 不用于按钮，全页只留给 kicker 方块与链接 hover。 */
      .actions {
        margin: 22px 0 0;
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        height: 38px;
        padding: 0 20px;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        text-decoration: none;
        transition:
          background-color 160ms ease,
          color 160ms ease;
      }

      .btn-primary {
        --glass-tint: color-mix(in hsl, var(--ink) 82%, transparent);
        --glass-edge: color-mix(in hsl, var(--ink) 30%, transparent);
        --rim-top: rgba(255, 255, 255, 0.34);
        --rim-mid: rgba(255, 255, 255, 0.06);
        --rim-bot: rgba(255, 255, 255, 0.14);
        --sheen: rgba(255, 255, 255, 0.16);
        --depth: hsl(0 0% 0% / 0.18);
        color: var(--paper);
      }

      .btn-primary:hover {
        --glass-tint: color-mix(in hsl, var(--ink) 92%, transparent);
      }

      /* 暗色下主按钮反白：变成一枚亮玻璃，厚度阴影用暖灰压重 */
      html[data-theme='dark'] .btn-primary {
        --glass-tint: color-mix(in hsl, var(--ink) 86%, transparent);
        --glass-edge: rgba(255, 255, 255, 0.22);
        --rim-top: rgba(255, 255, 255, 0.98);
        --rim-mid: rgba(255, 255, 255, 0.3);
        --rim-bot: rgba(255, 255, 255, 0.6);
        --sheen: rgba(255, 255, 255, 0.4);
        --depth: hsl(0 0% 0% / 0.1);
      }

      html[data-theme='dark'] .btn-primary:hover {
        --glass-tint: color-mix(in hsl, var(--ink) 96%, transparent);
      }

      .btn-ghost {
        color: var(--ink-2);
      }

      .btn-ghost:hover {
        --glass-tint: color-mix(in hsl, var(--paper) 72%, transparent);
        color: var(--ink);
      }

      .btn:focus-visible,
      .colophon a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* ---------- 窗壳：无边框窗口，红绿灯叠在应用内顶栏的预留空位 ---------- */
      .stage {
        flex: 1;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: clamp(24px, 3.5vh, 36px) 24px 44px;
      }

      .window {
        position: relative;
        width: var(--stage-w);
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--window-border);
        box-shadow: var(--window-shadow);
        background: var(--window-bg);
      }

      /* 窗沿边缘光：顶缘受光、底缘回暗——物理窗沿做法。
         叠在 iframe 之上但不拦截交互（与红绿灯同层逻辑）。 */
      .window::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        z-index: 3;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.35),
          inset 0 -1px 0 rgba(0, 0, 0, 0.04);
      }

      html[data-theme='dark'] .window::after {
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          inset 0 -1px 0 rgba(0, 0, 0, 0.35);
      }

      /* 内屏为真实设备逻辑尺寸（桌面 1112×773 / 手机 390×844），由 inline script
         按断点切换并等比缩放（transform: scale）——桌面布局永不触碰 768 移动断点，
         手机模式则刻意以 <768 宽度渲染，让应用走真实移动端布局 */
      .screen {
        position: relative;
        width: 1112px;
        height: 773px;
        transform-origin: top left;
      }

      .screen iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      /* macOS 红绿灯：应用无边框（原生标题栏已移除），灯直接落在
         应用内顶栏 40px 区域的预留空位（DESKTOP_SHELL.macTrafficLightsSpacer=68）。
         放在 .screen 内随应用一起缩放，与真实窗口严格一致 */
      .lights {
        position: absolute;
        top: 14px;
        left: 12px;
        z-index: 2;
        display: flex;
        gap: 8px;
        pointer-events: none;
      }

      .lights i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: block;
        box-shadow: inset 0 0 1px rgba(0, 0, 0, 0.18);
      }

      .lights i:nth-child(1) { background: #ff5f57; }
      .lights i:nth-child(2) { background: #febc2e; }
      .lights i:nth-child(3) { background: #28c840; }

      /* 下滑提示（仅手机模式显示，见末尾媒体查询）：第一屏底部的滚动引导 */
      .scroll-hint {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 18px;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-indent: 0.18em;
        color: var(--ink-3);
        pointer-events: none;
      }

      .scroll-hint i {
        width: 7px;
        height: 7px;
        border-right: 1.5px solid var(--ink-3);
        border-bottom: 1.5px solid var(--ink-3);
        transform: rotate(45deg);
      }

      /* 图注：学术图版式（图序加字距 + 说明小字），本页的签名细节 */
      .caption {
        margin-top: 18px;
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--ink-3);
      }

      .caption .fig-no {
        font-weight: 600;
        letter-spacing: 0.14em;
        color: var(--ink-2);
        margin-right: 10px;
      }

      /* ---------- 版权行：colophon ---------- */
      .colophon {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px 24px;
        flex-wrap: wrap;
        padding: 15px 32px 22px;
        border-top: 1px solid var(--hairline);
        font-size: 12px;
        letter-spacing: 0.04em;
        color: var(--ink-3);
      }

      .colophon nav {
        display: flex;
        gap: 20px;
      }

      .colophon a {
        color: var(--ink-2);
        text-decoration: none;
        transition: color 150ms ease;
      }

      .colophon a:hover {
        color: var(--accent);
      }

      @media (prefers-reduced-transparency: reduce) {
        /* 降级契约：关掉背景采样，玻璃退回不透明表面（脚本同样不注入透镜滤镜） */
        .glass {
          --glass-tint: var(--paper);
          -webkit-backdrop-filter: none;
          backdrop-filter: none;
        }
        .btn-primary {
          --glass-tint: var(--ink);
        }
      }

      /* ---------- 手机模式（≤767px，对齐应用 isSmallScreen 断点）----------
         多屏竖直滚动：题辞独占第一屏、演示独占一屏（100dvh）——窄屏每一寸
         都给演示。演示屏去窗壳化满宽，iframe 以设备真实 CSS 尺寸渲染
         （应用自然落入移动端布局；不做 transform 缩放，文字保持物理像素清晰）。 */
      @media (max-width: 767px) {
        :root {
          --stage-w: 100%;
        }
        /* 关闭原生滚动：页面不再有惯性/链接滚动，手势完全由 JS 分页器接管
           （translate3d 整屏平移，跟手 + 抬手翻屏）。这从根源上消除
           自由滚动方案的"滚动过头再拉回"与 CSS 磁吸方案的"中途回弹"。 */
        html,
        body {
          overflow: hidden;
          overscroll-behavior: none;
        }
        .pages {
          position: relative; /* 刊头 absolute 的包含块 */
          transition: transform 0.38s cubic-bezier(0.22, 0.8, 0.3, 1);
        }
        .pages.no-anim {
          transition: none; /* 跟手拖动期间禁用过渡 */
        }
        /* 刊头改为 absolute 随题辞屏一起走（fixed/悬浮会压住演示屏左上角）。
           整屏分页下停驻点只有整屏：题辞屏刊头在位，演示屏完全无遮挡。 */
        .masthead {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          padding-top: 10px;
        }
        /* 分页圆点：演示屏内滑动手势由应用 iframe 消费（到不了父页面），
           翻屏靠壳体边缘条手势或这组圆点 */
        .pager-dots {
          position: fixed;
          right: 3px;
          top: 50%;
          transform: translateY(-50%);
          z-index: 30;
          display: flex;
          flex-direction: column;
          gap: 8px;
        }
        .pager-dots button {
          width: 16px;
          height: 16px;
          padding: 0;
          border: 0;
          background: transparent;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
        }
        .pager-dots button::before {
          content: '';
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: color-mix(in srgb, var(--ink) 28%, transparent);
          transition:
            background 200ms ease,
            transform 200ms ease;
        }
        .pager-dots button.on::before {
          background: var(--ink);
          transform: scale(1.3);
        }
        /* 第一屏：题辞垂直居中 */
        .hero {
          min-height: 100svh;
          padding: 0 16px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          position: relative;
        }
        .kicker {
          margin-bottom: 10px;
        }
        .hero h1 {
          font-size: 26px;
        }
        .hero .sub {
          margin-top: 8px;
          line-height: 1.6;
        }
        .actions {
          margin-top: 14px;
        }
        /* 第二屏：演示独占一整屏。注意必须 flex:none——基础规则的 flex:1
           展开为 flex-basis:0%，basis 非 auto 时 height 不生效，会被压成 0。
           用 svh 不用 dvh：磁吸几何必须稳定，见上方 scroll-snap 注释。 */
        .stage {
          flex: none;
          height: 100svh;
          padding: 12px;
        }
        /* 演示壳带边距的圆角矩形（紧贴屏幕边缘既不美观也压迫内容） */
        .window {
          width: 100%;
          flex: 1;
          border-radius: 28px;
        }
        /* absolute inset 布局：绕开"块级子元素 % 高度依赖父级显式 height"
           的解析陷阱（.window 的高度来自 flex，非 height 属性） */
        .screen {
          position: absolute;
          inset: 0;
          width: auto;
          height: auto;
          transform: none;
        }
        .lights {
          display: none;
        }
        .caption {
          display: none;
        }
        /* 下滑提示：只在手机模式出现（桌面一屏尽览无需引导） */
        .scroll-hint {
          display: flex;
        }
        .colophon {
          padding: 12px 20px 16px;
        }
      }

      @media (max-width: 639px) {
        .masthead { padding: 12px 16px 0; }
        .pill-meta { display: none; }
      }

      @media (prefers-reduced-motion: no-preference) {
        .hero > * {
          animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .hero .sub { animation-delay: 0.08s; }
        .hero .actions { animation-delay: 0.14s; }
        .window {
          animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.18s both;
        }
        .caption {
          animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
        }
        .colophon {
          animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.38s both;
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="pages" id="pages">
    <header class="masthead">

            <path fill-rule="evenodd" clip-rule="evenodd" d="M10 29.6379C10 22.764 10 19.327 11.3378 16.7015C12.5145 14.3921 14.3921 12.5145 16.7015 11.3378C19.327 10 22.764 10 29.6379 10H96.3621C103.236 10 106.673 10 109.298 11.3378C111.608 12.5145 113.486 14.3921 114.662 16.7015C116 19.327 116 22.764 116 29.6379V35.6632C116 63.7837 116 77.844 110.527 88.5846C105.714 98.0323 98.0323 105.714 88.5846 110.527C77.844 116 63.7837 116 35.6632 116H29.6379C22.764 116 19.327 116 16.7015 114.662C14.3921 113.486 12.5145 111.608 11.3378 109.298C10 106.673 10 103.236 10 96.3621V29.6379ZM32.6636 38.85H53.598C72.1285 38.85 87.1504 53.8719 87.1504 72.4024C87.1504 90.9329 72.1285 105.955 53.598 105.955H32.6636C32.3707 105.955 32.2242 105.955 32.1004 105.952C25.4999 105.819 20.181 100.5 20.048 93.9C20.0456 93.7761 20.0456 93.6297 20.0456 93.3368V51.468C20.0456 51.1751 20.0456 51.0286 20.048 50.9048C20.181 44.3043 25.4999 38.9854 32.1004 38.8524C32.2242 38.85 32.3707 38.85 32.6636 38.85ZM95.8062 44.6188C103.183 44.6188 109.163 38.6866 109.163 31.3688C109.163 24.0511 103.183 18.1188 95.8062 18.1188C88.4294 18.1188 82.4493 24.0511 82.4493 31.3688C82.4493 38.6866 88.4294 44.6188 95.8062 44.6188ZM107.394 31.3911C107.394 34.1859 105.11 36.4515 102.292 36.4515C99.475 36.4515 97.191 34.1859 97.191 31.3911C97.191 28.5963 99.475 26.3307 102.292 26.3307C105.11 26.3307 107.394 28.5963 107.394 31.3911Z" />

    <!-- 分页圆点（仅手机模式显示）：演示屏内滑动手势由应用消费，
         页面翻屏靠边缘条手势或这里的圆点 -->
    <nav class="pager-dots" aria-label="分页导航">
      <button type="button" data-i="0" aria-label="题辞"></button>
      <button type="button" data-i="1" aria-label="实时演示"></button>
      <button type="button" data-i="2" aria-label="站点信息"></button>
    </nav>

    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        if (params.get('theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
        if (location.search) {
          document.getElementById('demo-frame').src = './demo.html' + location.search;
        }
        // 红绿灯仅在 macOS 布局下与顶栏预留空位对齐（非 Mac 环境无空位，隐藏）
        if (!/macintosh|mac os x/i.test(navigator.userAgent)) {
          var lights = document.getElementById('lights');
          lights.parentNode.removeChild(lights);
        }

        // 内屏尺寸双模式（断点 ≤767px 对齐应用 isSmallScreen）：
        // 桌面——真实窗口 1112×773 等比缩放适配窗壳（永不触碰移动断点）；
        // 手机——去窗壳化，CSS 接管全宽全高布局，iframe 以设备真实 CSS 尺寸
        // 渲染（无缩放最清晰）；此时必须清掉桌面模式写过的内联尺寸/变换。
        var mqPhone = window.matchMedia('(max-width: 767px)');
        var NATIVE_W = 1112;
        var NATIVE_H = 773;
        var windowEl = document.getElementById('window');
        var screenEl = document.getElementById('screen');
        function fit() {
          if (mqPhone.matches) {
            screenEl.style.width = '';
            screenEl.style.height = '';
            screenEl.style.transform = '';
            windowEl.style.height = '';
            return;
          }
          screenEl.style.width = NATIVE_W + 'px';
          screenEl.style.height = NATIVE_H + 'px';
          var scale = windowEl.clientWidth / NATIVE_W;
          screenEl.style.transform = 'scale(' + scale + ')';
          windowEl.style.height = Math.round(NATIVE_H * scale) + 'px';
        }
        window.addEventListener('resize', fit);
        window.addEventListener('load', fit);
        if (mqPhone.addEventListener) mqPhone.addEventListener('change', fit);
        fit();

        /* ================= 手机端整屏分页（transform 分页器） =================
           手机模式下原生滚动已关（overflow:hidden），页面没有任何惯性/链接
           滚动——手势完全由本分页器接管：跟手平移（边界橡皮筋 0.35 阻尼），
           抬手按位移阈值（56px）或速度（0.35px/ms）翻一屏。每次手势最多
           翻一屏，没有惯性链，从根源上没有"过头再拉回"。
           前两代方案的病历：CSS scroll-snap mandatory 在触屏上与惯性/iframe
           嵌套滚动打架（中途 re-snap 回弹、snap-stop 拦不住过头）；
           自由滚动+停稳吸附则是"过头再拉回"的形态。两者都已废弃。
           注意：演示屏内 iframe 的触摸事件到不了父页面（应用照常滚动），
           演示屏的翻屏入口 = 壳体 12px 边缘条手势 / 右侧分页圆点。 */
        (function () {
          var pages = document.getElementById('pages');
          var heroEl = document.querySelector('.hero');
          var stageEl = document.querySelector('.stage');
          var colophonEl = document.querySelector('.colophon');
          var dots = Array.prototype.slice.call(document.querySelectorAll('.pager-dots button'));
          var idx = 0;
          var dragging = false;
          var startY = 0;
          var startT = 0;
          var baseY = 0;

          /* 手机模式下原生滚动必须恒为 0：overflow:hidden 只挡用户滚动，
             浏览器 reload 的滚动恢复/程序化 scrollTo 仍会改 scrollY，
             它会与 transform 叠加把内容推出视口。 */
          function resetNativeScroll() {
            if (window.scrollY !== 0 || window.scrollX !== 0) window.scrollTo(0, 0);
          }

          // 三屏停驻位：题辞顶 / 演示顶 / 版权行贴底（等价 snap-align:end）
          function positions() {
            var demoTop = heroEl.offsetHeight;
            var total = heroEl.offsetHeight + stageEl.offsetHeight + colophonEl.offsetHeight;
            var endTop = Math.max(demoTop, total - window.innerHeight);
            return [0, demoTop, endTop];
          }

          function render(y) {
            pages.style.transform = 'translate3d(0,' + -y + 'px,0)';
          }

          function go(i, animate) {
            var pos = positions();
            idx = Math.max(0, Math.min(pos.length - 1, i));
            resetNativeScroll();
            pages.classList.toggle('no-anim', animate === false);
            if (animate !== false) {
              void pages.offsetHeight; // 确保过渡类状态已应用再改 transform
            }
            render(pos[idx]);
            for (var j = 0; j < dots.length; j++) {
              dots[j].classList.toggle('on', j === idx);
            }
          }

          pages.addEventListener('touchstart', function (e) {
            if (!mqPhone.matches || !e.touches.length) return;
            dragging = true;
            startY = e.touches[0].clientY;
            startT = Date.now();
            baseY = positions()[idx];
            pages.classList.add('no-anim');
          }, { passive: true });

          pages.addEventListener('touchmove', function (e) {
            if (!dragging) return;
            var pos = positions();
            var maxY = pos[pos.length - 1];
            var y = baseY - (e.touches[0].clientY - startY);
            if (y < 0) y *= 0.35; // 边界橡皮筋
            else if (y > maxY) y = maxY + (y - maxY) * 0.35;
            render(y);
          }, { passive: true });

          function endDrag(e) {
            if (!dragging) return;
            dragging = false;
            var t = e.changedTouches && e.changedTouches[0];
            var d = t ? t.clientY - startY : 0;
            var v = Math.abs(d) / Math.max(1, Date.now() - startT);
            var step = Math.abs(d) > 56 || v > 0.35 ? (d < 0 ? 1 : -1) : 0;
            go(idx + step);
          }
          pages.addEventListener('touchend', endDrag, { passive: true });
          pages.addEventListener('touchcancel', function () {
            if (!dragging) return;
            dragging = false;
            go(idx);
          }, { passive: true });

          // 窄桌面窗口（无触屏）用滚轮翻屏
          var wheelAcc = 0;
          var wheelLock = 0;
          window.addEventListener('wheel', function (e) {
            if (!mqPhone.matches) return;
            var now = Date.now();
            if (now < wheelLock) return;
            wheelAcc += e.deltaY;
            if (Math.abs(wheelAcc) > 48) {
              go(idx + (wheelAcc > 0 ? 1 : -1));
              wheelAcc = 0;
              wheelLock = now + 550;
            }
          }, { passive: true });

          for (var k = 0; k < dots.length; k++) {
            (function (d) {
              d.addEventListener('click', function () { go(+d.getAttribute('data-i')); });
            })(dots[k]);
          }

          // 尺寸变化（旋转/地址栏/窄桌面拖宽）保持当前屏对齐
          window.addEventListener('resize', function () {
            if (mqPhone.matches) go(idx, false);
          });
          if (mqPhone.addEventListener) {
            mqPhone.addEventListener('change', function (e) {
              if (!e.matches) {
                idx = 0;
                pages.style.transform = ''; // 回桌面模式：还原原生滚动态
                if ('scrollRestoration' in history) history.scrollRestoration = 'auto';
              } else {
                if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
                resetNativeScroll();
                go(idx, false);
              }
            });
          }
          if (mqPhone.matches) {
            if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
            resetNativeScroll();
            go(0, false);
          }
        })();
      })();

      /* ================= Liquid Glass：边缘折射 =================
         为每个 [data-glass] 元素生成一张与其尺寸/圆角严格匹配的位移图，
         经 SVG feDisplacementMap 作用于 backdrop（Chromium 支持
         backdrop-filter: url(#svgFilter)）。位移图编码：
           R = 128 + 127·dx，G = 128 + 127·dy（dx/dy ∈ [-1,1]，单位 = strength px）
           feDisplacementMap scale = 2·strength，故 (c−0.5)·scale = strength·d
         透镜剖面：以圆角矩形 SDF 到边沿的距离 t（0 = 边沿，1 = bevel 内侧）
         取 m = smoothstep(1−t)²，沿法线向内采样 —— 边沿把内侧内容放大外推，
         与实体玻璃边缘的观感一致；向内采样同时避免了在 backdrop 区域外取样。
         参数集中在 LG，便于调感觉。 */
      (function () {
        var LG = {
          bar:    { bevel: 14, strength: 9, blur: 8, saturate: 1.45 },
          button: { bevel: 12, strength: 7, blur: 2, saturate: 1.3 }
        };
        if (matchMedia('(prefers-reduced-transparency: reduce)').matches) return;
        var supports = window.CSS && CSS.supports &&
          (CSS.supports('backdrop-filter', 'url(#lg)') || CSS.supports('-webkit-backdrop-filter', 'url(#lg)'));
        if (!supports || typeof ResizeObserver === 'undefined') return;

        var NS = 'http://www.w3.org/2000/svg';
        var XLINK = 'http://www.w3.org/1999/xlink';
        var svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('width', '0');
        svg.setAttribute('height', '0');
        svg.setAttribute('aria-hidden', 'true');
        svg.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;pointer-events:none';
        document.body.appendChild(svg);
        document.documentElement.dataset.lg = 'lens';

        var glassEls = document.querySelectorAll('[data-glass]');
        for (var i = 0; i < glassEls.length; i++) setup(glassEls[i], i);

        function setup(el, index) {
          var id = 'lg-' + index;
          var kind = LG[el.getAttribute('data-glass')] || LG.bar;
          var filter = document.createElementNS(NS, 'filter');
          filter.setAttribute('id', id);
          filter.setAttribute('filterUnits', 'userSpaceOnUse');
          filter.setAttribute('color-interpolation-filters', 'sRGB');
          var map = document.createElementNS(NS, 'feImage');
          map.setAttribute('result', 'map');
          map.setAttribute('preserveAspectRatio', 'none');
          var disp = document.createElementNS(NS, 'feDisplacementMap');
          disp.setAttribute('in', 'SourceGraphic');
          disp.setAttribute('in2', 'map');
          disp.setAttribute('xChannelSelector', 'R');
          disp.setAttribute('yChannelSelector', 'G');
          disp.setAttribute('scale', String(kind.strength * 2));
          filter.appendChild(map);
          filter.appendChild(disp);
          svg.appendChild(filter);

          var lastKey = '';
          function render() {
            var w = Math.round(el.offsetWidth);
            var h = Math.round(el.offsetHeight);
            if (!w || !h) return;
            var r = Math.min(parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0, w / 2, h / 2);
            var key = w + 'x' + h + 'r' + r;
            if (key === lastKey) return;
            lastKey = key;
            filter.setAttribute('x', '0');
            filter.setAttribute('y', '0');
            filter.setAttribute('width', String(w));
            filter.setAttribute('height', String(h));
            map.setAttribute('x', '0');
            map.setAttribute('y', '0');
            map.setAttribute('width', String(w));
            map.setAttribute('height', String(h));
            var url = makeMap(w, h, r, kind.bevel);
            map.setAttribute('href', url);
            map.setAttributeNS(XLINK, 'xlink:href', url);
            var value = 'url(#' + id + ') blur(' + kind.blur + 'px) saturate(' + kind.saturate + ')';
            el.style.webkitBackdropFilter = value;
            el.style.backdropFilter = value;
          }
          new ResizeObserver(render).observe(el);
          render();
        }

        // 圆角矩形 SDF：dist < 0 在内部；(nx, ny) 为指向外侧的法线
        function makeMap(w, h, r, bevel) {
          var ss = 2; // 2× 超采样，让边沿剖面平滑
          var cw = w * ss, ch = h * ss;
          var canvas = document.createElement('canvas');
          canvas.width = cw;
          canvas.height = ch;
          var ctx = canvas.getContext('2d');
          var img = ctx.createImageData(cw, ch);
          var d = img.data;
          var hw = w / 2, hh = h / 2;
          var bx = hw - r, by = hh - r;
          for (var y = 0; y < ch; y++) {
            for (var x = 0; x < cw; x++) {
              var px = (x + 0.5) / ss - hw;
              var py = (y + 0.5) / ss - hh;
              var qx = Math.abs(px) - bx;
              var qy = Math.abs(py) - by;
              var dist, nx, ny;
              if (qx > 0 && qy > 0) {
                var len = Math.sqrt(qx * qx + qy * qy) || 1;
                dist = len - r; nx = qx / len; ny = qy / len;
              } else if (qx > qy) {
                dist = qx - r; nx = 1; ny = 0;
              } else {
                dist = qy - r; nx = 0; ny = 1;
              }
              if (px < 0) nx = -nx;
              if (py < 0) ny = -ny;
              var t = -dist / bevel;
              t = t < 0 ? 0 : t > 1 ? 1 : t;
              var s = 1 - t;
              var m = s * s * (3 - 2 * s);
              m = m * m;
              var idx = (y * cw + x) * 4;
              d[idx]     = Math.round(128 - nx * m * 127);
              d[idx + 1] = Math.round(128 - ny * m * 127);
              d[idx + 2] = 128;
              d[idx + 3] = 255;
            }
          }
          ctx.putImageData(img, 0, 0);
          return canvas.toDataURL('image/png');
        }
      })();
    </script>
