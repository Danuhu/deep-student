<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <!-- A11Y: 允许用户缩放（WCAG 1.4.4），上限 5 倍；viewport-fit=cover 保留安全区域支持 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Deep Student</title>
    <style>
      :root {
        color-scheme: dark;
        /* transitions.dev — Shimmer text 语义变量（boot 扫光） */
        --shimmer-dur: 2000ms;
        --shimmer-band: 400%;
        --shimmer-ease: linear;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: transparent;
        overflow: hidden;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      .boot-loading {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        box-sizing: border-box;
        padding: 24px;
        background: transparent;
      }

      .boot-loading__logo-wrap {
        position: relative;
        width: min(54vw, 240px);
        aspect-ratio: 409 / 147;
      }

      .boot-loading__logo {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* 深色主题默认展示白色 logo；浅色主题由 html[data-boot-theme] 切换为反色（黑）logo */
      .boot-loading__logo--light {
        display: none;
        filter: invert(1);
      }

      html[data-boot-theme="light"] .boot-loading__logo--dark {
        display: none;
      }

      html[data-boot-theme="light"] .boot-loading__logo--light {
        display: block;
      }

      .boot-loading__logo--shine {
        position: absolute;
        inset: 0;
        opacity: 0.9;
        /* transitions.dev Shimmer：透明 → 高亮 → 透明的扫光带，随 mask-position 线性往返 */
        -webkit-mask-image: linear-gradient(
          90deg,
          transparent          0%,
          transparent         40%,
          black               50%,
          transparent         60%,
          transparent        100%
        );
        -webkit-mask-size: var(--shimmer-band) 100%;
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-position: 100% 0;
        mask-image: linear-gradient(
          90deg,
          transparent          0%,
          transparent         40%,
          black               50%,
          transparent         60%,
          transparent        100%
        );
        mask-size: var(--shimmer-band) 100%;
        mask-repeat: no-repeat;
        mask-position: 100% 0;
        animation: boot-shimmer var(--shimmer-dur) var(--shimmer-ease) infinite;
        pointer-events: none;
      }

      /* 白色 logo 的扫光用提亮呈现（扫过深色描边），黑色 logo 的扫光用提亮呈现 */
      .boot-loading__logo--shine-dark {
        filter: brightness(1.75);
      }

      .boot-loading__logo--shine-light {
        filter: invert(1) brightness(1.9);
      }

      @keyframes boot-shimmer {
        0% {
          -webkit-mask-position: 100% 0;
          mask-position: 100% 0;
        }
        100% {
          -webkit-mask-position: 0% 0;
          mask-position: 0% 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-loading__logo--shine {
          animation: none !important;
          display: none;
        }
      }
    </style>
    <!-- ★ 启动前主题预判：外部文件以兼容 CSP script-src 'self'；为 boot 占位符选择深浅色 logo -->
    <script src="/boot-theme.js"></script>
    <!-- ★ 2026-02-04: 最早的全局错误过滤器 - 过滤 Tauri HTTP 插件的已知 bug -->
    <script>
      (function() {
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var message = '';
          if (reason instanceof Error) {
            message = reason.message || '';
          } else if (typeof reason === 'string') {
            message = reason;
          } else if (reason && typeof reason === 'object' && reason.message) {
            message = String(reason.message);
          }
          // 过滤 Tauri HTTP 插件的 fetch_cancel_body 错误
          if (message.indexOf('fetch_cancel_body') !== -1 || message.indexOf('http.fetch_cancel_body') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div
        class="boot-loading"
        role="status"
        aria-label="Deep Student loading"
        data-dstu-react-placeholder="true"
      >
        <div class="boot-loading__logo-wrap">
          <img
            class="boot-loading__logo boot-loading__logo--dark"
            src="/deepstudent-logo.svg"
            alt="Deep Student"
            width="409"
            height="147"
          />
          <img
            class="boot-loading__logo boot-loading__logo--dark boot-loading__logo--shine boot-loading__logo--shine-dark"
            src="/deepstudent-logo.svg"
            alt=""
            aria-hidden="true"
            width="409"
            height="147"
          />
          <img
            class="boot-loading__logo boot-loading__logo--light"
            src="/deepstudent-logo.svg"
            alt="Deep Student"
            width="409"
            height="147"
          />
          <img
            class="boot-loading__logo boot-loading__logo--light boot-loading__logo--shine boot-loading__logo--shine-light"
            src="/deepstudent-logo.svg"
            alt=""
            aria-hidden="true"
            width="409"
            height="147"
          />
        </div>
      </div>
    </div>
    <!-- Shared portal root to stabilize overlays and prevent DOM reparenting issues -->
    <div id="unified-modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
