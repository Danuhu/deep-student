# ╔══════════════════════════════════════════════════════════════════╗
# ║  单独重建 Android APK 并上传到指定 Release                     ║
# ╠══════════════════════════════════════════════════════════════════╣
# ║                                                                ║
# ║  用途: 仅重建 Android APK 并替换指定 Release 中的 APK          ║
# ║  场景: 修复移动端 Bug 后补发 APK / 某次 Release Android 构建   ║
# ║        失败需要重试                                             ║
# ║                                                                ║
# ║  安全保障 (审查 F6 修复):                                       ║
# ║    - source_ref 默认使用 tag 本身 (此前默认 main, 会把新代码    ║
# ║      构出的 APK 以旧版本名义发布, 产物与 tag 可追溯性断裂)     ║
# ║    - 校验 source_ref 代码中的版本号与 tag 一致; 确需跨版本      ║
# ║      热修时必须显式勾选 allow_version_mismatch                 ║
# ║    - 构建走 reusable-build-android.yml, 与主发布共用实现        ║
# ║      (含 Prepare Android project 权限/软键盘/MainActivity 注入)║
# ║    - 发布尾部自动刷新 CDN 缓存 (审查 F5: immutable 一年缓存 +  ║
# ║      同名覆盖, 不刷新则用户长期拿旧 APK)                        ║
# ║                                                                ║
# ║  操作: GitHub → Actions → Rebuild Android APK → Run workflow   ║
# ╚══════════════════════════════════════════════════════════════════╝

name: Rebuild Android APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '目标 Release 的 tag (如 v0.9.24)，APK 将上传到此 Release'
        required: true
        type: string
      source_ref:
        description: '构建代码来源 (分支/tag/commit SHA)，留空则使用 tag 本身'
        required: false
        default: ''
        type: string
      allow_version_mismatch:
        description: '允许 source_ref 版本号与 tag 不一致 (跨版本热修时显式确认)'
        required: false
        default: false
        type: boolean

concurrency:
  group: rebuild-android-${{ github.event.inputs.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  R2_BUCKET: deepstudent

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 预检: 确认目标 Release 存在 + source_ref 版本一致性校验
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.info.outputs.version }}
      tag_name: ${{ steps.info.outputs.tag_name }}
      source_ref: ${{ steps.info.outputs.source_ref }}
    steps:
      - name: Validate inputs & fetch release info
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: '${TAG}'. Expected: v0.9.24"
            exit 1
          fi

          RELEASE_ID=$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq '.id' 2>/dev/null || echo "")
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Release '${TAG}' not found"
            exit 1
          fi

          SOURCE_REF="${{ github.event.inputs.source_ref }}"
          if [ -z "$SOURCE_REF" ]; then
            SOURCE_REF="$TAG"
          fi

          VERSION="${TAG#v}"
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "source_ref=${SOURCE_REF}" >> $GITHUB_OUTPUT
          echo "✅ Target release: ${TAG} (id=${RELEASE_ID}), building from: ${SOURCE_REF}"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.info.outputs.source_ref }}

      # F6: 产物以 tag 版本命名发布，但代码来自 source_ref —— 两者版本号
      # 不一致时（例如手滑用 main 最新代码构旧 tag 的 APK）默认硬失败。
      - name: Verify source_ref version matches tag
        run: |
          TAG_VERSION="${{ steps.info.outputs.version }}"
          SRC_VERSION=$(jq -r '.version' package.json)
          echo "tag version:        ${TAG_VERSION}"
          echo "source_ref version: ${SRC_VERSION}"
          if [[ "$SRC_VERSION" != "$TAG_VERSION" ]]; then
            if [[ "${{ github.event.inputs.allow_version_mismatch }}" == "true" ]]; then
              echo "::warning::source_ref version (${SRC_VERSION}) != tag (${TAG_VERSION}) — proceeding because allow_version_mismatch=true"
            else
              echo "::error::source_ref version (${SRC_VERSION}) does not match tag (${TAG_VERSION})."
              echo "::error::如确需用其他版本的代码补发此 tag 的 APK，请勾选 allow_version_mismatch 重新触发。"
              exit 1
            fi
          else
            echo "✅ source_ref version matches tag"
          fi

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 构建 Android APK (与 release.yml 共用 reusable workflow)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  build-android:
    needs: [preflight]
    uses: ./.github/workflows/reusable-build-android.yml
    with:
      ref: ${{ needs.preflight.outputs.source_ref }}
      version: ${{ needs.preflight.outputs.version }}
    secrets: inherit

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 发布: 替换 Release 中的 APK 并更新 R2 + 刷新 CDN
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  publish:
    needs: [preflight, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # workflow ref 的 checkout：提供 scripts/ci/*
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-arm64
          path: android-output

      - name: Delete old APK from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.preflight.outputs.tag_name }}"
          echo "🗑️ Removing old APK assets from release ${TAG}..."

          ASSET_IDS=$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" \
            --jq '.assets[] | select(.name | endswith(".apk")) | .id' 2>/dev/null || echo "")

          if [ -n "$ASSET_IDS" ]; then
            echo "$ASSET_IDS" | while read -r AID; do
              NAME=$(gh api "repos/${GH_REPO}/releases/assets/${AID}" --jq '.name')
              echo "  Deleting: ${NAME} (id=${AID})"
              gh api -X DELETE "repos/${GH_REPO}/releases/assets/${AID}"
            done
          else
            echo "  No existing APK assets found"
          fi

      - name: Upload new APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.preflight.outputs.tag_name }}"
          APK_FILE=$(ls android-output/*.apk | head -1)
          APK_NAME=$(basename "$APK_FILE")
          echo "📤 Uploading ${APK_NAME} to release ${TAG}..."
          gh release upload "${TAG}" "$APK_FILE" --repo "${GH_REPO}" --clobber
          echo "✅ APK uploaded to GitHub Release"

      - name: Setup Node.js for wrangler
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Upload APK to R2 & update latest.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          TAG="${{ needs.preflight.outputs.tag_name }}"
          R2_BASE="https://download.deepstudent.cn/releases/${TAG}"
          APK_FILE=$(ls android-output/*.apk | head -1)
          APK_NAME=$(basename "$APK_FILE")

          echo "📤 Uploading APK to R2..."
          bash scripts/ci/r2-put.sh \
            "${R2_BUCKET}/releases/${TAG}/${APK_NAME}" \
            "$APK_FILE" \
            "application/vnd.android.package-archive" \
            "public, max-age=31536000, immutable"
          echo "✅ APK uploaded to R2"

          echo "📝 Updating R2 latest.json with new apk_url..."
          npx wrangler r2 object get "${R2_BUCKET}/releases/latest.json" \
            --file /tmp/current-latest.json --remote 2>/dev/null || true

          if [ -f /tmp/current-latest.json ]; then
            APK_URL="${R2_BASE}/${APK_NAME}"
            jq --arg apk "$APK_URL" '.apk_url = $apk' /tmp/current-latest.json > /tmp/updated-latest.json

            echo "Updated latest.json:"
            cat /tmp/updated-latest.json

            bash scripts/ci/r2-put.sh \
              "${R2_BUCKET}/releases/latest.json" \
              "/tmp/updated-latest.json" \
              "application/json" \
              "public, max-age=300"
            echo "✅ R2 latest.json updated with apk_url: ${APK_URL}"
          else
            echo "⚠️ Could not fetch current latest.json from R2, skipping update"
          fi

      # F5: APK 与旧文件同名同 key、immutable 一年缓存 —— 不 purge 则
      # 走 CDN 的用户继续拿被替换前的旧 APK。
      - name: Purge Cloudflare CDN cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          TAG="${{ needs.preflight.outputs.tag_name }}"
          APK_NAME=$(basename "$(ls android-output/*.apk | head -1)")
          {
            echo "https://download.deepstudent.cn/releases/${TAG}/${APK_NAME}"
            echo "https://download.deepstudent.cn/releases/latest.json"
          } > /tmp/purge-urls.txt
          bash scripts/ci/purge-cdn.sh /tmp/purge-urls.txt
