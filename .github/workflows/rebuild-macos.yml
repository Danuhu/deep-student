# Emergency macOS-only rebuild for an existing draft or published release.
# The user explicitly accepts ad-hoc, non-notarized recovery bundles.

name: Rebuild macOS Release Assets

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '目标 Release tag（如 v0.9.43）'
        required: true
        type: string

concurrency:
  group: rebuild-macos-${{ github.event.inputs.tag_name }}-${{ github.workflow_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/reusable-verify-version.yml
    with:
      tag_name: ${{ github.event.inputs.tag_name }}

  build-macos:
    needs: [verify]
    uses: ./.github/workflows/reusable-build-macos.yml
    with:
      tag_name: ${{ needs.verify.outputs.tag_name }}
      allow_unsigned: true
    secrets: inherit

  replace-release-assets:
    needs: [verify, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-*
          path: macos-artifact

      - name: Flatten and validate macOS artifacts
        run: |
          set -euo pipefail
          mkdir -p macos-assets
          find macos-artifact -type f -exec mv {} macos-assets/ \;

          find macos-assets -type f -name '* *' | while IFS= read -r f; do
            DIR=$(dirname "$f")
            OLD=$(basename "$f")
            NEW=$(echo "$OLD" | tr ' ' '.')
            mv "$f" "$DIR/$NEW"
          done

          ARM_TAR=$(find macos-assets -maxdepth 1 -name '*_aarch64.app.tar.gz' ! -name '*.sig' | wc -l | tr -d ' ')
          INTEL_TAR=$(find macos-assets -maxdepth 1 -name '*_x86_64.app.tar.gz' ! -name '*.sig' | wc -l | tr -d ' ')
          SIG_COUNT=$(find macos-assets -maxdepth 1 -name '*.app.tar.gz.sig' | wc -l | tr -d ' ')
          DMG_COUNT=$(find macos-assets -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')
          if [[ "$ARM_TAR" -ne 1 || "$INTEL_TAR" -ne 1 || "$SIG_COUNT" -ne 2 || "$DMG_COUNT" -ne 2 ]]; then
            echo "::error::Expected both macOS architectures (2 updater archives, 2 signatures, 2 DMGs)"
            find macos-assets -maxdepth 1 -type f -print
            exit 1
          fi
          ls -lh macos-assets

      - name: Remove old macOS assets from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.verify.outputs.tag_name }}"
          gh release view "$TAG" --repo "$GH_REPO" --json assets -q '.assets[].name' |
            while IFS= read -r name; do
              [[ -z "$name" ]] && continue
              if [[ "$name" == *.dmg || "$name" == *.app.tar.gz || "$name" == *.app.tar.gz.sig ]]; then
                gh release delete-asset "$TAG" "$name" --repo "$GH_REPO" -y || true
              fi
            done

      - name: Upload macOS assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.verify.outputs.tag_name }}"
          gh release upload "$TAG" macos-assets/* --repo "$GH_REPO" --clobber
          echo "✅ macOS ARM64 + Intel assets uploaded to ${TAG}"
