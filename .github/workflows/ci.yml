name: CI

on:
  push:
    branches: [main, develop, nightly]
  pull_request:
    branches: [main, develop, nightly]

# 取消同一分支上的重复运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Only this contract job needs full history. Non-release jobs below inject a
  # deterministic build number so their default shallow checkouts remain cheap.
  # Stable release metadata and clean-runner Cargo configuration.
  build-config:
    name: Build Configuration Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Test version and proxy contracts
        run: node --test scripts/__tests__/*.test.mjs

      - name: Validate generated Android versionCode
        run: node scripts/generate-version.mjs --check

      - name: Verify generation leaves tracked build config clean
        run: |
          mkdir -p src-tauri/gen/android/app
          : > src-tauri/gen/android/app/tauri.properties
          node scripts/generate-version.mjs
          ANDROID_VERSION_CODE="$(node scripts/generate-version.mjs --print-android-version-code)"
          grep -qx "tauri.android.versionCode=${ANDROID_VERSION_CODE}" src-tauri/gen/android/app/tauri.properties
          git diff --exit-code

  # ============================================
  # 前端编译检查
  # ============================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      DEEP_STUDENT_BUILD_NUMBER: '14635'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Verify third-party license notices
        run: npm run licenses:check

      - name: Generate version info
        run: node scripts/generate-version.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (ESLint, errors block merge)
        run: npm run lint

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high || true

  # ============================================
  # 前端单元测试（Vitest）
  #
  # 战略审计 2026-07-04 P0 接入：此前 ~1.7k 条 vitest 用例只在本地跑，
  # CI 完全没有前端测试信号。维护者转入兼职模式后，这是外部贡献者 PR
  # 的第一道回归防线。
  #
  # vitest.config.ts 为规避 Node22 tinypool 崩溃使用 forks 多进程池
  # （不要改回 singleFork：单进程串行会因 jsdom 内存跨文件累积触发
  # GC 抖动近似死锁，分片会卡死直到 45 分钟超时）。4 路分片并行跑。
  # ============================================
  frontend-tests:
    name: Frontend Tests (Vitest ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEEP_STUDENT_BUILD_NUMBER: '14635'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Generate version info
        run: node scripts/generate-version.mjs

      - name: Run vitest shard
        run: npx vitest run --shard=${{ matrix.shard }}/4

  # ============================================
  # 后端编译检查
  # ============================================
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      DEEP_STUDENT_BUILD_NUMBER: '14635'
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler

      - name: Build check
        working-directory: src-tauri
        run: cargo check

      # W0–W1 clippy gate (C3): Cargo.toml [lints.clippy] sets correctness=deny
      # and style=warn (+ allow-listed debt). CLI -D correctness is belt-and-suspenders;
      # do not pass -W clippy::style here (would override per-lint allows).
      - name: Clippy (lib, correctness deny)
        working-directory: src-tauri
        run: cargo clippy --lib -- -D clippy::correctness

  windows-shell-sandbox:
    name: Windows Shell Sandbox
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      DEEP_STUDENT_BUILD_NUMBER: '14635'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Compile Windows backend
        working-directory: src-tauri
        run: cargo check --lib

      - name: Enforce AppContainer filesystem boundary
        working-directory: src-tauri
        run: cargo test --lib chat_v2::tools::shell_sandbox::windows::tests -- --nocapture

  # ============================================
  # 同步模块回归测试
  #
  # 批判报告 P0-1 接入：这批测试（约 253 条用例，11k 行）原本只写不跑。
  # 这里作为独立 job 跑起来，避免和 Build 合在一起时互相阻塞 / 超时。
  # 所有 sync_* 测试都用内存 SQLite + MockCloudStorage，零外部依赖。
  # ============================================
  sync-tests:
    name: Sync Regression (${{ matrix.test-target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test-target:
          - sync_scenarios_tests
          - sync_adversarial_tests
          - sync_chaos_tests
          - sync_integration_deep_tests
          - sync_pathological_tests
          - sync_proptest
          - sync_real_business_tables_tests
          - sync_real_schema_tests
          - sync_regression_tests
          - sync_weird_tests
          # 审阅 35 P0-2 补齐（2026-07-08）：此前矩阵漏掉的 5 个 sync 目标
          - sync_comprehensive_tests
          - sync_provider_contract_tests
          - sync_realistic_scenarios
          - sync_real_flow_smoke_tests
          - sync_schema_coverage_tests
    env:
      CARGO_INCREMENTAL: 0
      DEEP_STUDENT_BUILD_NUMBER: '14635'
      # proptest 在 CI 里用随机种子；固定一下便于 reproduce
      PROPTEST_CASES: '64'
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 与 backend job 分开缓存 key，避免互相踩
          key: sync-tests

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler

      - name: Run sync regression target
        working-directory: src-tauri
        # 单 runner 只跑一个 sync test target，避免 10 个重型测试二进制串在同一 job
        # 里编译/链接/执行时被 hosted runner 杀掉，同时能精确定位是哪一个目标失败。
        run: cargo test --test ${{ matrix.test-target }}

  # ============================================
  # 后端库内联单元测试（全量 #[cfg(test)]）
  #
  # 审阅 35 P0-1 接入（2026-07-08）：此前只跑 data_governance::sync 一个
  # 模块的 inline 测试，chat_v2（770 条，含审批/shell 执行/技能安装等
  # 安全关键路径）及其余 2100+ 条 lib 内联测试从不在 CI 运行。
  # 改为全量 cargo test --lib（自然包含原 sync 模块过滤范围）。
  # ============================================
  lib-unit-tests:
    name: Lib Unit Tests (cargo test --lib)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      DEEP_STUDENT_BUILD_NUMBER: '14635'
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: sync-tests

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler

      - name: Run all in-module unit tests (#[cfg(test)], incl. chat_v2)
        working-directory: src-tauri
        run: cargo test --lib

  # ============================================
  # 非 sync 集成测试（tests/ 下的独立 target）
  #
  # 审阅 35 P0-2 接入（2026-07-08）：secure_store_tests（密钥存储）等
  # --test 目标此前只写不跑。复用 sync-tests 的单 runner 单 target 模式。
  #
  # 注意：migration_tests 已从矩阵移除 —— tests/migration_tests.rs 整体
  # 位于 #![cfg(feature = "old_migration_impl")]（非默认 feature）之后，
  # 编译产物是 0 条测试的空二进制，"0 passed; 0 failed" 是假绿。
  # 生产迁移框架的真实门禁见下方 migration-gate job。
  # ============================================
  integration-tests:
    name: Integration Tests (${{ matrix.test-target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test-target:
          - secure_store_tests
          - tools_integration_tests
          - tool_pack_integration_tests
          - anki_export_integration
          - mcpbench_integration
          - error_details_tests
          - app_command_acl
          - c1_cross_lang_consistency
    env:
      CARGO_INCREMENTAL: 0
      DEEP_STUDENT_BUILD_NUMBER: '14635'
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: sync-tests

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler

      - name: Run integration test target
        working-directory: src-tauri
        run: cargo test --test ${{ matrix.test-target }}

  # ============================================
  # 数据库迁移门禁（PR 层）
  #
  # 分层设计（详见 scripts/migration-ci/README.md）：
  #   PR/branch push（本 job）: 静态门禁 + 生产 data_governance 迁移测试
  #     （显式要求非零测试数，替代已移除的 migration_tests 假绿目标）
  #     + 代表性 fixture 升级（无 fixture secret 时显式跳过，如 fork PR）
  #   main/nightly: migration-nightly.yml（全量 fixture + 故障注入 + 规模）
  #   release: release.yml migration-compatibility-gate（fail-closed）
  # ============================================
  migration-gate:
    name: Migration Gate (static + production tests + fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      DEEP_STUDENT_BUILD_NUMBER: '14635'
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      # fetch-depth: 0 —— 静态门禁的 --base-ref 不可变性校验需要 base 分支历史
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Static migration gate (lock manifest + dangerous SQL)
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            node scripts/check-migrations.mjs --base-ref "origin/${{ github.base_ref }}"
          else
            node scripts/check-migrations.mjs
          fi

      - name: Migration CI tooling self-tests
        run: node --test scripts/migration-ci/__tests__/*.test.mjs

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: sync-tests

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler

      # 生产统一迁移框架测试（src/data_governance/migration*），
      # run-migration-tests.sh 解析 cargo 汇总并强制通过数 >= --min-tests，
      # 杜绝 "0 passed; 0 failed" 假绿。
      - name: Production migration tests (non-zero count enforced)
        run: bash scripts/migration-ci/run-migration-tests.sh --min-tests 50

      # 代表性 fixture 升级。fixture 来自私有归档 secret；fork PR 拿不到
      # secret 时 fetch-fixtures.sh --mode skip 输出 fixtures_available=false
      # 并显式打 warning —— 跳过是可见的，不是假绿。
      - name: Fetch representative fixtures
        id: fixtures
        env:
          MIGRATION_FIXTURE_URL: ${{ secrets.MIGRATION_FIXTURE_URL }}
          MIGRATION_FIXTURE_SHA256: ${{ secrets.MIGRATION_FIXTURE_SHA256 }}
          MIGRATION_FIXTURE_TOKEN: ${{ secrets.MIGRATION_FIXTURE_TOKEN }}
        run: |
          bash scripts/migration-ci/fetch-fixtures.sh \
            --tier representative --dest "$RUNNER_TEMP/migration-fixtures" --mode skip

      - name: Representative fixture upgrades
        if: steps.fixtures.outputs.fixtures_available == 'true'
        run: |
          bash scripts/migration-ci/run-fixture-upgrades.sh \
            --fixture-root "${{ steps.fixtures.outputs.fixture_root }}" \
            --mode upgrade \
            --report "$RUNNER_TEMP/migration-reports/representative-upgrade.jsonl"

      - name: Upload fixture upgrade report
        if: steps.fixtures.outputs.fixtures_available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: migration-gate-fixture-report
          path: ${{ runner.temp }}/migration-reports/
          retention-days: 14

  # ============================================
  # 供应链安全审计
  # ============================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit (informational)
        working-directory: src-tauri
        # Non-blocking: advisories are almost always deep transitive deps
        # (aws-lc-sys via aws-sdk-s3, rustls-webpki via tokio-rustls, etc.)
        # that cannot be easily updated without major version bumps.
        run: cargo audit || true
