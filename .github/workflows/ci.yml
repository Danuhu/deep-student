name: CI

on:
  push:
    branches: [main, develop, nightly]
  pull_request:
    branches: [main, develop, nightly]

# 取消同一分支上的重复运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only this contract job needs full history. Non-release jobs below inject a
  # deterministic build number so their default shallow checkouts remain cheap.
  # Stable release metadata and clean-runner Cargo configuration.
  build-config:
    name: Build Configuration Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Test version and proxy contracts
        run: node --test scripts/__tests__/*.test.mjs

      - name: Validate generated Android versionCode
        run: node scripts/generate-version.mjs --check

      - name: Verify generation leaves tracked build config clean
        run: |
          mkdir -p src-tauri/gen/android/app
          : > src-tauri/gen/android/app/tauri.properties
          node scripts/generate-version.mjs
          ANDROID_VERSION_CODE="$(node scripts/generate-version.mjs --print-android-version-code)"
          grep -qx "tauri.android.versionCode=${ANDROID_VERSION_CODE}" src-tauri/gen/android/app/tauri.properties
          git diff --exit-code

  # ============================================
  # 前端编译检查
  # ============================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      DEEP_STUDENT_BUILD_NUMBER: '14635'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Generate version info
        run: node scripts/generate-version.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (ESLint, errors block merge)
        run: npm run lint

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high || true

  # ============================================
  # 前端单元测试（Vitest）
  #
  # 战略审计 2026-07-04 P0 接入：此前 ~1.7k 条 vitest 用例只在本地跑，
  # CI 完全没有前端测试信号。维护者转入兼职模式后，这是外部贡献者 PR
  # 的第一道回归防线。
  #
  # vitest.config.ts 为规避 Node22 tinypool 崩溃使用 forks 多进程池
  # （不要改回 singleFork：单进程串行会因 jsdom 内存跨文件累积触发
  # GC 抖动近似死锁，分片会卡死直到 45 分钟超时）。4 路分片并行跑。
  # ============================================
  frontend-tests:
    name: Frontend Tests (Vitest ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEEP_STUDENT_BUILD_NUMBER: '14635'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Generate version info
        run: node scripts/generate-version.mjs

      - name: Run vitest shard
        run: npx vitest run --shard=${{ matrix.shard }}/4

  # ============================================
  # 后端编译检查
  # ============================================
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      DEEP_STUDENT_BUILD_NUMBER: '14635'
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler

      - name: Build check
        working-directory: src-tauri
        run: cargo check

  # ============================================
  # 同步模块回归测试
  #
  # 批判报告 P0-1 接入：这批测试（约 253 条用例，11k 行）原本只写不跑。
  # 这里作为独立 job 跑起来，避免和 Build 合在一起时互相阻塞 / 超时。
  # 所有 sync_* 测试都用内存 SQLite + MockCloudStorage，零外部依赖。
  # ============================================
  sync-tests:
    name: Sync Regression (${{ matrix.test-target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test-target:
          - sync_scenarios_tests
          - sync_adversarial_tests
          - sync_chaos_tests
          - sync_integration_deep_tests
          - sync_pathological_tests
          - sync_proptest
          - sync_real_business_tables_tests
          - sync_real_schema_tests
          - sync_regression_tests
          - sync_weird_tests
          # 审阅 35 P0-2 补齐（2026-07-08）：此前矩阵漏掉的 5 个 sync 目标
          - sync_comprehensive_tests
          - sync_provider_contract_tests
          - sync_realistic_scenarios
          - sync_real_flow_smoke_tests
          - sync_schema_coverage_tests
    env:
      CARGO_INCREMENTAL: 0
      DEEP_STUDENT_BUILD_NUMBER: '14635'
      # proptest 在 CI 里用随机种子；固定一下便于 reproduce
      PROPTEST_CASES: '64'
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 与 backend job 分开缓存 key，避免互相踩
          key: sync-tests

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler

      - name: Run sync regression target
        working-directory: src-tauri
        # 单 runner 只跑一个 sync test target，避免 10 个重型测试二进制串在同一 job
        # 里编译/链接/执行时被 hosted runner 杀掉，同时能精确定位是哪一个目标失败。
        run: cargo test --test ${{ matrix.test-target }}

  # ============================================
  # 后端库内联单元测试（全量 #[cfg(test)]）
  #
  # 审阅 35 P0-1 接入（2026-07-08）：此前只跑 data_governance::sync 一个
  # 模块的 inline 测试，chat_v2（770 条，含审批/shell 执行/技能安装等
  # 安全关键路径）及其余 2100+ 条 lib 内联测试从不在 CI 运行。
  # 改为全量 cargo test --lib（自然包含原 sync 模块过滤范围）。
  # ============================================
  lib-unit-tests:
    name: Lib Unit Tests (cargo test --lib)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      DEEP_STUDENT_BUILD_NUMBER: '14635'
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: sync-tests

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler

      - name: Run all in-module unit tests (#[cfg(test)], incl. chat_v2)
        working-directory: src-tauri
        run: cargo test --lib

  # ============================================
  # 非 sync 集成测试（tests/ 下的独立 target）
  #
  # 审阅 35 P0-2 接入（2026-07-08）：migration_tests（数据库迁移，数据
  # 丢失风险最高）、secure_store_tests（密钥存储）等 7 个 --test 目标
  # 此前只写不跑。复用 sync-tests 的单 runner 单 target 模式。
  # ============================================
  integration-tests:
    name: Integration Tests (${{ matrix.test-target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test-target:
          - migration_tests
          - secure_store_tests
          - tools_integration_tests
          - tool_pack_integration_tests
          - anki_export_integration
          - mcpbench_integration
          - error_details_tests
          - app_command_acl
    env:
      CARGO_INCREMENTAL: 0
      DEEP_STUDENT_BUILD_NUMBER: '14635'
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: sync-tests

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler

      - name: Run integration test target
        working-directory: src-tauri
        run: cargo test --test ${{ matrix.test-target }}

  # ============================================
  # 供应链安全审计
  # ============================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit (informational)
        working-directory: src-tauri
        # Non-blocking: advisories are almost always deep transitive deps
        # (aws-lc-sys via aws-sdk-s3, rustls-webpki via tokio-rustls, etc.)
        # that cannot be easily updated without major version bumps.
        run: cargo audit || true
